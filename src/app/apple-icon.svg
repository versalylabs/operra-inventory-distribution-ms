      <stop offset="100%" stop-color="#000710"/>
    </linearGradient>
    <linearGradient id="apple-ember" x1="90" y1="65" x2="145" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b1a"/>
